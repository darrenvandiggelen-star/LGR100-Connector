name: Build LiveMorph v2.1 APK

on:
  push:
    branches: [ "livemorph-v2-1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Fetch matching live face-swap engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.9.34 https://github.com/AbrahamPaulJ/facefusion-mobile.git upstream
          curl -L --fail --retry 3 -o facefusion-release.apk             https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.34/facefusion-mobile-0.9.34-release.apk
          mkdir -p native-apk prebuilt/arm64-v8a
          unzip -q facefusion-release.apk 'lib/arm64-v8a/*' -d native-apk
          cp native-apk/lib/arm64-v8a/* prebuilt/arm64-v8a/
          test -f prebuilt/arm64-v8a/libffnative.so
          test -f prebuilt/arm64-v8a/libc++_shared.so

      - name: Install LiveMorph presets and branding
        shell: bash
        run: |
          set -euxo pipefail
          cat livemorph/presets.b64.part* | base64 -d > presets.zip
          unzip -t presets.zip
          mkdir -p upstream/work/android/app/src/main/assets/presets
          unzip -q presets.zip -d upstream/work/android/app/src/main/assets/presets
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream/work/android")
          main = root / "app/src/main/java/com/facefusion/mobile/MainActivity.kt"
          s = main.read_text()

          marker = "    private fun restoreSources() {"
          assert marker in s
          assert "installBundledPresets" not in s
          fn = r'''    /** The built-in LiveMorph identities. They enter the exact same source list as a picked photo. */
              private fun installBundledPresets() {
                  val names = runCatching { assets.list("presets")?.toList().orEmpty() }
                      .getOrDefault(emptyList())
                  for (name in names.sorted()) {
                      if (!name.endsWith(".jpg", true) && !name.endsWith(".png", true)) continue
                      val source = File(sourcesDir(), "builtin_" + name)
                      if (!source.exists()) {
                          runCatching {
                              assets.open("presets/" + name).use { input ->
                                  source.outputStream().use { output -> input.copyTo(output) }
                              }
                          }
                      }
                      val saved = File(savedDir(), "builtin_" + name)
                      if (source.exists() && !saved.exists()) {
                          runCatching { source.copyTo(saved) }
                      }
                  }
                  refreshSavedFaces()
              }

          '''
          s = s.replace(marker, fn + marker, 1)
          call = "        modelDir()\n        // The faces from last time."
          assert call in s
          s = s.replace(call, "        modelDir()\n        installBundledPresets()\n        // The faces from last time.", 1)
          main.write_text(s)

          gradle = root / "app/build.gradle.kts"
          g = gradle.read_text()
          replacements = {
              'val appLabel = if (hasContentGate) "FaceFusion" else "FaceFusion Dev"':
                  'val appLabel = if (hasContentGate) "LiveMorph" else "LiveMorph Dev"',
              'applicationId = "com.facefusion.mobile$idSuffix"':
                  'applicationId = "com.livemorph.app$idSuffix"',
              'versionCode = 106': 'versionCode = 210',
              'versionName = "0.9.34$variantTag"': 'versionName = "2.1.0$variantTag"',
              'setProperty("archivesBaseName", "facefusion-mobile-$versionName")':
                  'setProperty("archivesBaseName", "LiveMorph-$versionName")',
              'versionNameSuffix = "-mic-debug"': 'versionNameSuffix = "-debug"',
          }
          for old, new in replacements.items():
              assert old in g, old
              g = g.replace(old, new, 1)
          gradle.write_text(g)

          comp = root / "app/src/main/java/com/facefusion/mobile/ui/Components.kt"
          c = comp.read_text()
          assert 'append("FACE")' in c and 'append("FUSION")' in c
          c = c.replace('append("FACE")', 'append("LIVE")', 1)
          c = c.replace('append("FUSION")', 'append("MORPH")', 1)
          comp.write_text(c)

          saver = root / "app/src/main/java/com/facefusion/mobile/GallerySaver.kt"
          t = saver.read_text().replace('Environment.DIRECTORY_MOVIES + "/FaceFusion"',
                                        'Environment.DIRECTORY_MOVIES + "/LiveMorph"')
          saver.write_text(t)

          print("LiveMorph patch applied")
          PY

      - name: Build LiveMorph APK
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream/work/android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug             -PprebuiltNativeDir="$GITHUB_WORKSPACE/prebuilt"

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find upstream/work/android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/LiveMorph-v2.1-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose apk-output/LiveMorph-v2.1-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging apk-output/LiveMorph-v2.1-debug.apk             | head -n 15 | tee apk-output/badging.txt
          sha256sum apk-output/LiveMorph-v2.1-debug.apk | tee apk-output/SHA256.txt
          unzip -l apk-output/LiveMorph-v2.1-debug.apk | grep 'assets/presets/' | tee apk-output/presets.txt
          grep -q 'com.livemorph.app.debug' apk-output/badging.txt
          grep -q 'versionName=.2.1.0-debug' apk-output/badging.txt
          test "$(wc -l < apk-output/presets.txt)" -ge 6

      - name: Upload LiveMorph APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveMorph-v2.1-APK
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
