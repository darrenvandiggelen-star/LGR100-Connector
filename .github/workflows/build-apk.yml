name: Build LGR100 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Locate project
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "LGR100_Source.zip" ]; then
            rm -rf _lgr100_source
            mkdir -p _lgr100_source
            unzip -q "LGR100_Source.zip" -d _lgr100_source
            PROJECT_DIR="$(find _lgr100_source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "Could not find settings.gradle inside LGR100_Source.zip"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            echo "No Android project or LGR100_Source.zip found in repository."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          mkdir -p apk-output
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Build completed but no debug APK was found."
            exit 1
          fi
          cp "$APK" "apk-output/LGR100-Connector-V0.1-debug.apk"
          sha256sum "apk-output/LGR100-Connector-V0.1-debug.apk" > "apk-output/LGR100-Connector-V0.1-debug.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LGR100-Connector-APK
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
