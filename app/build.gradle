plugins {
    id 'com.android.application'
}

android {
    namespace 'com.getfunds.lgr100connector'
    compileSdk 35

    defaultConfig {
        applicationId "com.getfunds.lgr100connector"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "0.7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
